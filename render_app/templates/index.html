<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCraft | Panel de Control Render</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131b2e;
            --bg-input: #1c273e;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15), transparent 70%);
        }
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .brand-title span { color: var(--primary); }
        .badge-render {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Colab Link Banner */
        .colab-banner {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .colab-banner-text { font-size: 13.5px; color: #e2e8f0; }
        .colab-banner-text strong { color: var(--primary); }
        .btn-colab {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
        }
        .btn-colab:hover { transform: translateY(-1px); }

        /* Configuration Card */
        .config-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        /* Status Box */
        .status-box {
            text-align: center;
            padding: 28px;
            background: rgba(2, 6, 23, 0.5);
            border-radius: 18px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .status-pulse {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--danger);
            margin-right: 10px;
            box-shadow: 0 0 12px var(--danger);
            transition: all 0.3s;
        }
        .status-pulse.online { background: var(--success); box-shadow: 0 0 16px var(--success); animation: pulse 2s infinite; }
        .status-pulse.starting { background: var(--warning); box-shadow: 0 0 16px var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .status-text { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .stat-val { font-size: 17px; font-weight: 700; font-family: 'Fira Code', monospace; }

        /* MAIN RESTART BUTTON */
        .btn-restart {
            width: 100%;
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: #090d16;
            border: none;
            border-radius: 14px;
            padding: 20px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.35);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-restart:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 35px rgba(245, 158, 11, 0.45); }
        .btn-restart:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .sub-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }
        .btn-action {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }
        .btn-start { background: var(--success); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25); }
        .btn-stop { background: var(--danger); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.25); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            border-left: 4px solid var(--primary);
            color: #fff;
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="brand">
            <div class="brand-title">CLOUD<span>CRAFT</span></div>
            <span class="badge-render">Render Control</span>
        </div>
        <button class="btn-action" style="background: rgba(255,255,255,0.08); font-size:13px; padding: 8px 16px;" onclick="checkStatus()">🔄 Actualizar</button>
    </div>

    <!-- Colab Quick Launch Banner -->
    <div class="colab-banner">
        <div class="colab-banner-text">
            <strong>¿Tu servidor no responde?</strong> Abre tu cuaderno de Google Colab en 1 clic.
        </div>
        <a href="https://colab.research.google.com/" target="_blank" class="btn-colab">🚀 Abrir Colab</a>
    </div>

    <!-- Tunnel Configuration (Saved in localStorage automatically) -->
    <div class="config-card">
        <div class="form-group">
            <label class="form-label">URL del Túnel de Colab (Ngrok / Zrok / LocalToNet)</label>
            <input id="colabUrl" type="url" class="form-input" placeholder="Ejemplo: https://xxxx.ngrok-free.app" onchange="saveCreds()">
        </div>
        <div class="form-group">
            <label class="form-label">Clave API Secreta (API Key)</label>
            <input id="apiKey" type="password" class="form-input" value="cloudcraft-secret-key-2026" onchange="saveCreds()">
        </div>
    </div>

    <!-- Server Status Display -->
    <div class="status-box">
        <div style="display:flex; align-items:center; justify-content:center; margin-bottom: 6px;">
            <span id="statusPulse" class="status-pulse"></span>
            <span id="statusText" class="status-text">DESCONECTADO</span>
        </div>
        <div style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;" id="ipDisplay">IP: Esperando conexión...</div>
    </div>

    <!-- Resources & Players Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Jugadores</div>
            <div id="playersVal" class="stat-val">0 / 0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Uso RAM</div>
            <div id="ramVal" class="stat-val">0 GB</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Uso CPU</div>
            <div id="cpuVal" class="stat-val">0 %</div>
        </div>
    </div>

    <!-- MAIN RESTART BUTTON -->
    <button id="btnRestart" class="btn-restart" onclick="restartServer()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12"/></svg>
        REINICIAR SERVIDOR
    </button>

    <!-- Sub Start/Stop Controls -->
    <div class="sub-actions">
        <button id="btnStart" class="btn-action btn-start" onclick="startServer()">▶ Iniciar</button>
        <button id="btnStop" class="btn-action btn-stop" onclick="stopServer()">⏹ Detener</button>
    </div>

    <!-- Console Command Sender -->
    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; gap: 10px;">
        <input id="cmdInput" type="text" class="form-input" style="flex:1;" placeholder="Enviar comando a la consola (ej: /op tu_nombre)" onkeydown="if(event.key==='Enter') sendCommand()">
        <button class="btn-action" style="background: var(--primary); color:#090d16; padding: 0 24px;" onclick="sendCommand()">Enviar</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3500);
    }

    function loadCreds() {
        const savedUrl = localStorage.getItem('cloudcraft_url') || '{{ default_url }}';
        const savedKey = localStorage.getItem('cloudcraft_key') || '{{ default_key }}';
        if (savedUrl) document.getElementById('colabUrl').value = savedUrl;
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    }

    function saveCreds() {
        const url = document.getElementById('colabUrl').value.trim();
        const key = document.getElementById('apiKey').value.trim();
        localStorage.setItem('cloudcraft_url', url);
        localStorage.setItem('cloudcraft_key', key);
    }

    function getCredentials() {
        saveCreds();
        return {
            colab_url: document.getElementById('colabUrl').value.trim(),
            api_key: document.getElementById('apiKey').value.trim()
        };
    }

    async function checkStatus() {
        const creds = getCredentials();
        if (!creds.colab_url) return;

        try {
            const res = await fetch('/api/proxy/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(creds)
            });
            const data = await res.json();

            if (data.status === 'ok') {
                const s = data.server_status;
                const p = document.getElementById('statusPulse');
                const t = document.getElementById('statusText');

                p.className = 'status-pulse ' + s;
                t.innerText = s === 'online' ? 'EN LÍNEA' : (s === 'starting' ? 'INICIANDO...' : (s === 'stopping' ? 'DETENIENDO...' : 'APAGADO'));

                document.getElementById('ipDisplay').innerText = 'IP: ' + (data.ip || 'N/A');
                document.getElementById('playersVal').innerText = `${data.players_online} / ${data.players_max}`;
                document.getElementById('ramVal').innerText = `${data.ram_used_gb} GB`;
                document.getElementById('cpuVal').innerText = `${data.cpu_percent}%`;
            } else {
                document.getElementById('statusText').innerText = 'DESCONECTADO';
                showToast('⚠ ' + (data.message || 'Error al conectar'));
            }
        } catch (e) {
            document.getElementById('statusText').innerText = 'DESCONECTADO';
        }
    }

    async function restartServer() {
        const creds = getCredentials();
        if (!creds.colab_url) {
            showToast('⚠ Pega la URL del túnel de tu Colab primero.');
            return;
        }
        if (!confirm('¿Seguro que deseas REINICIAR el servidor de Minecraft?')) return;

        const btn = document.getElementById('btnRestart');
        btn.disabled = true;
        btn.innerText = 'REINICIANDO SERVIDOR...';

        try {
            const res = await fetch('/api/proxy/restart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(creds)
            });
            const data = await res.json();
            if (data.status === 'ok') {
                showToast('✅ Orden de reinicio enviada correctamente.');
                setTimeout(checkStatus, 3000);
            } else {
                showToast('❌ ' + (data.message || 'Error al reiniciar.'));
            }
        } catch (e) {
            showToast('❌ Error de red al comunicarse con Render.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12"/></svg> REINICIAR SERVIDOR`;
        }
    }

    async function startServer() {
        const creds = getCredentials();
        const res = await fetch('/api/proxy/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(creds)
        });
        const data = await res.json();
        if (data.status === 'ok') showToast('✅ Servidor iniciándose...');
        else showToast('❌ ' + data.message);
        setTimeout(checkStatus, 2000);
    }

    async function stopServer() {
        const creds = getCredentials();
        const res = await fetch('/api/proxy/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(creds)
        });
        const data = await res.json();
        if (data.status === 'ok') showToast('✅ Deteniendo servidor...');
        else showToast('❌ ' + data.message);
        setTimeout(checkStatus, 2000);
    }

    async function sendCommand() {
        const creds = getCredentials();
        const cmdInput = document.getElementById('cmdInput');
        const cmd = cmdInput.value.trim();
        if (!cmd) return;

        creds.command = cmd;
        const res = await fetch('/api/proxy/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(creds)
        });
        const data = await res.json();
        if (data.status === 'ok') {
            showToast('✅ Comando enviado: ' + cmd);
            cmdInput.value = '';
        } else {
            showToast('❌ ' + data.message);
        }
    }

    loadCreds();
    setInterval(checkStatus, 10000);
    checkStatus();
</script>
</body>
</html>
